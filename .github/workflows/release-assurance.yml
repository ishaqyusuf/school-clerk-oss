name: Release assurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-assurance-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: release-assurance-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Refuse external fork Preview verification
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.16"
      - name: Verify Preview provider evidence
        uses: ./.release/toolkit/ec653d87eb0b65bbac9235680d85eed6fdfd20a1/action
        env:
          SCHOOL_CLERK_RELEASE_EVIDENCE_ENVELOPE: ${{ secrets.SCHOOL_CLERK_RELEASE_EVIDENCE_ENVELOPE }}
          SCHOOL_CLERK_RELEASE_EVIDENCE_HMAC_KEY: ${{ secrets.SCHOOL_CLERK_RELEASE_EVIDENCE_HMAC_KEY }}
          SCHOOL_CLERK_VERCEL_DASHBOARD_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_DASHBOARD_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_MARKETING_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_MARKETING_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_SITE_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_SITE_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_API_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_API_PROJECT_ID }}
          SCHOOL_CLERK_TRIGGER_PROJECT_REF: ${{ vars.SCHOOL_CLERK_TRIGGER_PROJECT_REF }}
        with:
          environment: preview
          repository-root: ${{ github.workspace }}

  production:
    name: release-assurance-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse stale main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.16"
      - name: Verify Production provider evidence
        uses: ./.release/toolkit/ec653d87eb0b65bbac9235680d85eed6fdfd20a1/action
        env:
          SCHOOL_CLERK_RELEASE_EVIDENCE_ENVELOPE: ${{ secrets.SCHOOL_CLERK_RELEASE_EVIDENCE_ENVELOPE }}
          SCHOOL_CLERK_RELEASE_EVIDENCE_HMAC_KEY: ${{ secrets.SCHOOL_CLERK_RELEASE_EVIDENCE_HMAC_KEY }}
          SCHOOL_CLERK_VERCEL_DASHBOARD_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_DASHBOARD_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_MARKETING_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_MARKETING_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_SITE_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_SITE_PROJECT_ID }}
          SCHOOL_CLERK_VERCEL_API_PROJECT_ID: ${{ vars.SCHOOL_CLERK_VERCEL_API_PROJECT_ID }}
          SCHOOL_CLERK_TRIGGER_PROJECT_REF: ${{ vars.SCHOOL_CLERK_TRIGGER_PROJECT_REF }}
        with:
          environment: production
          repository-root: ${{ github.workspace }}
